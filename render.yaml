services:
  - type: web
    name: vega-crimelife-forum
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm run render:build
    startCommand: npm start
    healthCheckPath: /api/health
    domains:
      - vegacrimelife.de
    envVars:
      - key: NODE_VERSION
        value: '24.x'
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        value: https://vegacrimelife.de
      - key: DISCORD_REDIRECT_URI
        value: https://vegacrimelife.de/api/auth/discord/callback
      - key: TRUSTED_PROXY
        value: 'true'
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CAPTCHA_SECRET
        generateValue: true
